# Link checker configuration (issue #9), read by .github/workflows/links.yml.
# The files to check and the root directory are passed by the workflow.

# Also check in-page anchors (#home, #projet...).
include_fragments = "anchor-only"

exclude = [
  # LinkedIn answers 999 to every robot (seen in PR #8): check it by hand.
  '^https://(www\.)?linkedin\.com/',
]

remap = [
  # GitHub builds the #readme anchor with JavaScript, so lychee never finds it:
  # check the repository page without the anchor.
  '^(https://github\.com/[^#]+)#readme$ $1',
]

# twitter.com is excluded by lychee's own defaults, so the footer link is never
# checked here. It redirects to x.com (301), which answers 200: check it by hand.
