name: Links

on:
  pull_request:
  push:
    branches: [master]
  # An external link can die without any change to the repository.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --config .github/lychee.toml
            --root-dir ${{ github.workspace }}
            index.html
            404.html
            README.md
            package.json
            js/i18n.js
            lang/en.json
            lang/fr.json
            css/style.css

  local-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # lychee reads JS and JSON as plain text and only finds absolute URLs,
      # so relative paths written there (the language flag) are checked here.
      # A path is one quoted string with a "/", no space and no ":" (URLs stay
      # with lychee), ending in one of the lowercase extensions listed in ext.
      # Paths built at runtime ("img/" + name, template literals) are not seen.
      # The browser resolves them against the page that loads the script: the
      # only one is index.html, at the root, so they are checked from the root.
      - name: Check local paths in JS and JSON
        # Without it the step runs as "bash -e", without pipefail, and grep's
        # exit status would be lost in the pipe to tr.
        shell: bash
        run: |
          # package.json is npm metadata: the browser never loads its paths.
          mapfile -t files < <(git ls-files '*.js' '*.json' ':(exclude)package.json')
          chars="[^\"'[:space:]:]"
          ext="\.(png|jpe?g|gif|svg|webp|ico|css|js|json|html|pdf)"
          pattern="\"$chars+/$chars*$ext\"|'$chars+/$chars*$ext'"
          status=0
          # -H keeps the file name even when there is a single file.
          matches=$(grep -HnoE "$pattern" "${files[@]}" | tr -d "\"'") || status=$?
          # grep exits 1 when nothing matches, 2 on a real error.
          [ "$status" -le 1 ] || { echo "::error::grep failed (exit $status)"; exit 1; }
          found=0
          missing=0
          if [ -n "$matches" ]; then
            while IFS=: read -r file line path; do
              found=$((found + 1))
              if [ ! -f "${path#/}" ]; then
                echo "::error file=$file,line=$line::$path not found"
                missing=$((missing + 1))
              fi
            done <<< "$matches"
          fi
          echo "$found local paths checked in ${#files[@]} files, $missing missing"
          # Never pass without checking anything: the pattern would be out of date.
          [ "$found" -gt 0 ] || { echo "::error::no local path found in JS or JSON files"; exit 1; }
          [ "$missing" -eq 0 ]
