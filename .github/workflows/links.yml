name: Links

on:
  pull_request:
  push:
    branches: [master]
  # An external link can die without any change to the repository.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --config .github/lychee.toml
            --root-dir ${{ github.workspace }}
            index.html
            404.html
            README.md
            package.json
            js/i18n.js
            lang/en.json
            lang/fr.json
            css/style.css
